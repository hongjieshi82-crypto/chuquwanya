name: Deploy frontend to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Expo Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/client/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/client

      - name: Build frontend for GitHub Pages
        run: npm run build:web
        working-directory: apps/client
        env:
          EXPO_NO_DOTENV: '1'
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Verify production artifact
        working-directory: apps/client
        run: |
          test -s dist/index.html
          test -s dist/pc.html
          test -s dist/gravity-home/index.html
          test -f dist/.nojekyll
          grep -Fx 'chuquwanya.fun' dist/CNAME
          grep -F '京ICP备2026046201号-2' dist/gravity-home/index.html
          if grep -q '/chuquwanya/_expo/' dist/pc.html; then
            echo 'Production assets must use the custom domain root.'
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/client/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy frontend
        id: deployment
        uses: actions/deploy-pages@v4
