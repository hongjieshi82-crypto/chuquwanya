server {
    server_name chuquwanya.fun www.chuquwanya.fun;

    root /var/www/chuquwanya-next;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|png|jpe?g|webp|avif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/chuquwanya.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chuquwanya.fun/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name chuquwanya.fun www.chuquwanya.fun;
    return 301 https://$host$request_uri;
}
