server {
    server_name api.chuquwanya.fun;

    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 75s;
    }

    # Domestic preview for the static frontend. Unknown browser routes fall
    # back to the exported index so Expo Router can resolve them client-side.
    location / {
        root /var/www/chuquwanya-next;
        try_files $uri $uri.html $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|png|jpe?g|webp|avif|svg|ico|woff2?)$ {
        root /var/www/chuquwanya-next;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/api.chuquwanya.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.chuquwanya.fun/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = api.chuquwanya.fun) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name api.chuquwanya.fun;
    return 404;
}
